name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: npm ci
      - run: npm test
      - run: npm run package
      - name: Archive
        run: |
          name="kiosk-rotator-${GITHUB_REF_NAME#v}-linux-x64.tar.gz"
          tar czf "$name" -C out kiosk-rotator-linux-x64
          sha256sum "$name" > "$name.sha256"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" kiosk-rotator-*.tar.gz* --generate-notes
